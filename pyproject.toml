[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baddeley-cognitive-memory"
version = "0.1.0"
authors = [
  { name="Waldemar Gajda", email="contact@waldemargajda.com" },
]
description = "Bounded Recurrent Working Memory Architectures for Infinite Context Processing in LLMs (O(1) Memory)"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
"Homepage" = "https://github.com/cognitive-working-memory/baddeley-cognitive-memory"
"Paper" = "https://arxiv.org/abs/2609.xxxxx"
